<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173d32"><meta name="description" content="24 Türchen. Ein Bauprojekt. Der Bau-Adventskalender 2026."><title>24 kleine Gedöns Momente</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Display&display=swap');
:root{--ink:#203e33;--paper:#f8f3e9;--gold:#c5a66b;--muted:#7b8173}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.13' filter='url(%23n)'/%3E%3C/svg%3E")}a{color:inherit}header{max-width:1192px;margin:auto;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;text-transform:uppercase}.brand{display:flex;align-items:center;gap:10px}.brand svg{width:22px;height:22px}.year{border:1px solid #cfc8b5;border-radius:30px;padding:8px 13px;letter-spacing:1.5px}main{max-width:1192px;margin:auto;padding:0 32px}.intro{text-align:center;padding:65px 0 48px;position:relative}.eyebrow{letter-spacing:3px;font-size:10px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px}.eyebrow:before,.eyebrow:after{content:'';width:28px;height:1px;background:var(--gold)}h1{font-family:'Libre Caslon Display',Georgia,serif;font-size:clamp(49px,7vw,88px);font-weight:400;line-height:.98;margin:21px 0 17px;letter-spacing:-2px}h1 em{font-weight:400;color:#6c7b62}.subtitle{font-size:14px;line-height:1.8;color:#70786a;margin:0}.flourish{color:var(--gold);font-size:25px;display:block;margin:16px 0 4px}.calendar-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dcd6c8;padding:15px 0 14px;font-size:11px}.calendar-top strong{letter-spacing:2px;font-size:10px;font-weight:600;text-transform:uppercase}.status{display:flex;align-items:center;gap:7px;color:#717b6d}.dot{height:6px;width:6px;background:#94a181;border-radius:50%}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;padding:22px 0 28px}.door{position:relative;aspect-ratio:1/1.19;text-decoration:none;border:0;border-radius:7px;background:#214638;box-shadow:0 2px 3px #263b2c12;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e5d5ab;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:inherit}.door:nth-child(4n+2){background:#2d5142}.door:nth-child(4n+3){background:#365444}.door:nth-child(5n){background:#233f34}.door:before{content:'';position:absolute;inset:8px;border:1px solid #d4b8793d;border-radius:3px}.door:after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:#bea268;right:18px;top:51%;box-shadow:0 0 0 2px #c7ab6a20}.door:focus-visible{outline:3px solid #af7e32;outline-offset:4px}.door .num{font-family:'Libre Caslon Display',Georgia,serif;font-size:clamp(36px,4.6vw,59px);font-weight:400;line-height:1.1;z-index:1}.door .motif{height:30px;width:30px;margin-bottom:12px;opacity:.65;stroke-width:1.1}.door .label{font-size:8px;letter-spacing:1.4px;text-transform:uppercase;margin-top:10px;display:flex;align-items:center;gap:4px;opacity:.7}.label svg{width:8px;height:8px}.door.locked{cursor:default}.door.open{background:#ebe2cd;color:#314b38;box-shadow:inset 0 0 0 1px #cbbc98}.door.open:before{border-color:#bba37766}.door.today{background:#b78947;color:#fff4d8}.door.today:before{border-color:#fff0ba70}.door.today .label{opacity:1}.door:not(.locked):hover{transform:translateY(-3px);box-shadow:0 6px 16px #263b2c20}.door.seen .label:before{content:'✓';font-size:11px}.note{display:flex;gap:10px;align-items:center;justify-content:center;font-size:11px;color:#7b8174;line-height:1.6;text-align:center;padding:5px 0 28px}.note svg{width:14px;height:14px;flex-shrink:0}footer{padding:20px 0 30px;border-top:1px solid #dcd6c8;display:flex;justify-content:space-between;font-size:10px;color:#8b8d80}.heart{color:#ab714f}#message{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#173d32;color:#fff4dc;padding:15px 24px;border-radius:40px;font-size:13px;box-shadow:0 6px 28px #0002;z-index:5;max-width:90%;width:max-content;text-align:center}#message[hidden]{display:none}.sprig{position:absolute;width:94px;height:94px;color:#a8af91;top:58px;left:3%;opacity:.6;transform:rotate(-25deg)}.sprig.right{left:auto;right:3%;transform:scaleX(-1) rotate(-25deg)}
@media(min-width:1200px){.intro{padding-top:65px}.grid{gap:17px}.door{aspect-ratio:1/1.12}}
@media(max-width:1024px){header{padding:24px}.intro{padding-top:50px}main{padding:0 24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.door{aspect-ratio:1/1.12}.door .num{font-size:50px}.sprig{width:65px;height:65px;left:0;top:65px}.sprig.right{right:0}.subtitle{font-size:13px}}
@media(max-width:480px){header{padding:21px 18px;font-size:9px;letter-spacing:1.4px}.year{font-size:9px}main{padding:0 18px}.intro{padding:40px 0 30px}.eyebrow{font-size:9px;letter-spacing:2px}h1{font-size:57px;letter-spacing:-1px;margin-top:20px}.subtitle{font-size:12px}.sprig{display:none}.calendar-top{font-size:10px}.calendar-top strong{font-size:9px;letter-spacing:1px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:17px}.door .num{font-size:45px}.door .motif{height:23px;width:23px;margin-bottom:7px}.door .label{font-size:7px;letter-spacing:1px}.door:after{right:14px}.note{font-size:10px;padding-bottom:22px}footer{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Paper bears echo the handmade Advent calendar. */
body{overflow-x:clip}.intro h1{position:relative;z-index:1}.intro .sprig.right{display:none}
.edge-bear{position:absolute;top:8px;right:calc((min(1192px, 100vw) - 100vw)/2 - 96px);width:350px;height:248px;overflow:hidden;pointer-events:none;user-select:none;z-index:0}.edge-bear img{display:block;width:100%;height:auto}
.calendar-top{position:relative;isolation:isolate;min-height:72px}.calendar-top strong,.status{position:relative;z-index:1}.calendar-bear{position:absolute;right:38px;bottom:0;width:108px;height:125px;object-fit:cover;object-position:top;opacity:.23;pointer-events:none;user-select:none;z-index:0}.status{background:transparent;border-radius:20px;padding:5px 9px}
@media(min-width:1440px){.edge-bear{width:420px;right:calc((1192px - 100vw)/2 - 115px)}}
@media(max-width:1024px){.edge-bear{width:290px;height:222px;right:-100px;top:4px}.calendar-bear{right:22px;width:100px;height:116px}.intro h1{font-size:clamp(49px,7vw,76px)}}
@media(max-width:600px){.edge-bear{width:185px;height:154px;right:-30px;top:0}.intro{padding-top:100px;padding-bottom:42px}.intro h1{font-size:clamp(41px,10.8vw,57px);letter-spacing:-1.5px}.calendar-top{align-items:flex-end;gap:12px;padding-bottom:14px;min-height:78px}.calendar-top strong{max-width:140px;line-height:1.5}.calendar-bear{right:13px;width:85px;height:105px}.status{font-size:9px;gap:5px;text-align:right;padding:4px 6px}.dot{flex-shrink:0}}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none"><symbol id="star" viewBox="0 0 32 32"><path d="m16 3 3.3 9.5L29 16l-9.7 3.5L16 29l-3.3-9.5L3 16l9.7-3.5Z"/><path d="m25 3 .8 2.2L28 6l-2.2.8L25 9l-.8-2.2L22 6l2.2-.8Z"/></symbol><symbol id="book" viewBox="0 0 32 32"><path d="M16 9C11 5 6 6 3 7v20c5-2 9-1 13 2 4-3 8-4 13-2V7c-3-1-8-2-13 2Zm0 0v20M7 12l5 1m-5 4 5 1m8-5 5-1m-5 6 5-1"/></symbol><symbol id="tree" viewBox="0 0 32 32"><path d="m16 3-7 9h4l-7 9h6l-6 6h20l-6-6h6l-7-9h4Zm0 24v4"/></symbol><symbol id="cup" viewBox="0 0 32 32"><path d="M6 12h18v8a9 9 0 0 1-18 0Zm18 1h2a4 4 0 0 1 0 8h-2M3 30h25M10 3c-3 3 3 3 0 6m7-7c-3 3 3 3 0 6"/></symbol><symbol id="gift" viewBox="0 0 32 32"><path d="M4 14h24v15H4Zm-2-6h28v6H2Zm14 0v21M16 8C4 10 6-3 13 3Zm0 0C28 10 26-3 19 3Z"/></symbol><symbol id="lock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="8" rx="2"/><path d="M5 7V4a3 3 0 0 1 6 0v3"/></symbol><symbol id="sprig" viewBox="0 0 100 100"><path d="M20 90Q50 50 80 10M34 70Q9 60 17 40q19 9 17 30M46 54Q21 40 31 23q19 12 15 31M57 39Q39 22 51 8q15 13 6 31M36 67q24 6 32-13-21-9-32 13M49 49q25 5 30-14-21-8-30 14M61 32q25 1 28-16-19-3-28 16"/></symbol></svg>
<main><section class="intro"><div class="edge-bear" aria-hidden="true"><img src="./images/bear-peeking.png" alt="" width="1348" height="1167" fetchpriority="high"></div><svg class="sprig" fill="none" stroke="currentColor"><use href="#sprig"/></svg><svg class="sprig right" fill="none" stroke="currentColor"><use href="#sprig"/></svg><h1>24 kleine<br><em>Gedöns Momente.</em></h1></section>
<section aria-label="Dein Adventskalender"><div class="calendar-top"><img class="calendar-bear" src="./images/bear-standing.png" alt="" aria-hidden="true" width="1024" height="1536"><strong>Dein Bau-Adventskalender</strong><span class="status"><span class="dot"></span><span id="status">Der Advent wartet auf dich</span></span></div><div class="grid" id="doors"></div></section>
<p class="note"><svg fill="none" stroke="currentColor"><use href="#lock"/></svg>Jeden Tag ab 00:00 Uhr deutscher Zeit ein neues Türchen.<br>Deine geöffneten Anleitungen bleiben für dich da.</p><footer><span>24 Türchen. Ein Bauprojekt.</span><span>Dezember 2026</span></footer></main><div id="message" role="status" hidden></div>
<script type="module">
import{files}from'./days.js';import{unlocked,berlinDate,YEAR,ORDER}from'./calendar.js';
const grid=document.querySelector('#doors'),status=document.querySelector('#status'),message=document.querySelector('#message');let timer;const motifs=['star','book','tree','cup','gift','star'];
function seen(day){try{return localStorage.getItem('advent2026-'+day)==='yes'}catch{return false}}
function refresh(){const now=new Date(),today=berlinDate(now);let available=0;grid.replaceChildren();for(const day of ORDER){const open=unlocked(day,now),isToday=today===`${YEAR}-12-${String(day).padStart(2,'0')}`;if(open)available++;const door=document.createElement(open?'a':'button');door.className='door '+(open?'open':'locked')+(isToday?' today':'')+(seen(day)?' seen':'');door.setAttribute('aria-label',open?`Türchen ${day}: Bauanleitung als PDF öffnen`:`Türchen ${day}, öffnet am ${day}. Dezember ${YEAR}`);door.innerHTML=`<svg class="motif" fill="none" stroke="currentColor" aria-hidden="true"><use href="#${day===24?'gift':motifs[(day-1)%6]}"/></svg><span class="num">${String(day).padStart(2,'0')}</span><span class="label">${open?(isToday?'Heute für dich':'Anleitung öffnen'):`<svg fill="none" stroke="currentColor" aria-hidden="true"><use href="#lock"/></svg>${day}. Dezember`}</span>`;if(open){door.href='./anleitungen/'+files[day-1];door.target='_blank';door.rel='noopener';door.addEventListener('click',()=>{try{localStorage.setItem('advent2026-'+day,'yes')}catch{}door.classList.add('seen')})}else{door.type='button';door.setAttribute('aria-disabled','true');door.addEventListener('click',()=>{message.textContent=`Noch ein bisschen Vorfreude: ab ${day}. Dezember für dich da.`;message.hidden=false;clearTimeout(timer);timer=setTimeout(()=>message.hidden=true,3500)})}grid.append(door)}status.textContent=available===0?'Vorfreude ab 1. Dezember':available===24?'Alle 24 Türchen sind für dich da':`${available} von 24 Türchen geöffnet`;}
refresh();setInterval(refresh,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('pageshow',refresh);
</script></body></html>
